PACKAGE_NAME="wujie14x-uniwill"
PACKAGE_VERSION="@PACKAGE_VERSION@"
BUILT_MODULE_NAME[0]="uniwill-laptop"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"

# CachyOS ships clang-built kernels; the module must be built with the same
# toolchain, so pass LLVM=1 whenever the target kernel was built with clang.
MAKE[0]="make -C /usr/lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build $(grep -qs '^CONFIG_CC_IS_CLANG=y' /usr/lib/modules/${kernelver}/build/.config && echo LLVM=1) modules"
